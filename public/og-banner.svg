<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="sun" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f42a41" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f42a41" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#sun)"/>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" rx="30" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Compass Icon -->
  <g transform="translate(100, 110)">
    <circle cx="50" cy="50" r="48" fill="#064e3b" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="50" cy="50" r="20" fill="#f42a41"/>
    <polygon points="50,15 58,45 50,50 42,45" fill="#ffffff"/>
    <polygon points="50,85 58,55 50,50 42,55" fill="#94a3b8"/>
  </g>

  <!-- Main Headline -->
  <text x="230" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#34d399" letter-spacing="2">
    যাযাবর মিটার (JAJABOR METER)
  </text>
  <text x="230" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#f59e0b">
    বাংলাদেশের ৬৪ জেলার ভ্রমণ ও ফাঁপর মিটার
  </text>

  <!-- Large Bold Hook Text -->
  <text x="100" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff">
    আপনি কি আসল যাযাবর
  </text>
  <text x="100" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#fbbf24">
    নাকি খাটের রাজা?
  </text>

  <!-- Subtitle -->
  <text x="100" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">
    ম্যাপে ঘুরে আসা জেলা সিলেক্ট করুন, ফাঁপর ডিটেক্টরে টেস্ট দিন ও সনদপত্র শেয়ার করুন!
  </text>

  <!-- Footer Domain Badge -->
  <rect x="100" y="525" width="340" height="48" rx="24" fill="#047857" fill-opacity="0.5" stroke="#10b981" stroke-width="2"/>
  <text x="135" y="557" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#a7f3d0">
    jajabor.mdrasel.site
  </text>
</svg>
